name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Codeberg's hosted runners advertise codeberg-tiny|small|medium. medium gives a 10-min
    # window — ample for the first, uncached pull of the Rust image and the build. On a
    # self-hosted Forgejo, register a runner with this label or change it here.
    #
    # xmcp only ships for macOS, but nothing in the crate is target-gated (the IDE socket is a
    # plain UnixStream), so fmt, clippy and the unit/protocol tests all run on Linux. The IDE
    # round-trip (scripts/ide-test.sh) needs a running Xojo IDE and stays a local step.
    runs-on: codeberg-medium
    container:
      image: rust:latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        # The rust image has no Node, and Codeberg's runner doesn't inject one into custom
        # job containers, so the JS-based actions/checkout can't run. Clone manually with
        # the git that ships in the image instead.
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c protocol.version=2 fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
